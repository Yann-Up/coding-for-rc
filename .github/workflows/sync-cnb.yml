name: sync-cnb

# 把 GitHub Release 同步到 CNB（cnb.cool），作为国内下载加速渠道：
#   1. 取本 Release 的 APK，对文件字节实测 SHA-256（不从 Release 正文里正则抓哈希字符串）
#   2. 生成 CNB 版清单 latest.json（客户端契约）
#   3. 把该 tag 推到 CNB 仓，触发 CNB 侧 .cnb.yml 的 tag_push 流水线
#   4. 实测 CNB 附件直链可下载且哈希一致；拿不到或对不上只告警，不阻断发布
#   5. 把 latest.json 提交到 CNB 仓的 updater 分支（该分支只有 latest.json，不夹带源码；
#      提交前挡掉 versionCode 回退，手动补同步旧 tag 不会覆盖更新的清单）
#
# 触发用 push: tags，而不是 release: published。被 tag 的那个提交里的 release.yml
# 是用 Actions 自带的 GITHUB_TOKEN 创建 Release 的，而 GitHub 规定「由 GITHUB_TOKEN 触发的
# 事件不会再触发新的 workflow 运行」，所以 release: published 对自动流程根本不生效
# （v0.1.6 就是这么漏掉的，只能手动补一次）。tag push 一定会触发，代价是本文件取自
# 被 tag 的那个提交，改动要先合进 master 再打标签才生效——与 .cnb.yml 同一条纪律。
#
# 因为改成 tag push 触发，本工作流会和 release.yml 同时起跑，而 APK 要等 release.yml
# 构建签名完才存在，所以下载前有一段带时限的等待（见「等待 Release 附件就绪」）。
#
# 这里不改版本号、也不重新构建 APK：版本号由人工同步 build.sh 与 AndroidManifest.xml，
# tag 与 build.sh 的 VERSION_NAME 是否一致由 tools/release-notes.sh 校验（不一致就让本工作流失败）；
# 签名 APK 由已有的 release.yml 在 tag push 时产出，本工作流只做搬运和核对。
#
# 只依赖一个自定义 secret：CNB_TOKEN（CNB 访问令牌，需含 repo-contents 读写权限），
# GITHUB_TOKEN 由 Actions 自动提供。token 只经 env 传入，不写文件、不打印。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 tag（需已发布对应 Release，如 v0.1.6）"
        required: true
        type: string

permissions:
  contents: read

env:
  CNB_REPO: Yann-Up/coding-for-rc
  CNB_WEB: https://cnb.cool/Yann-Up/coding-for-rc
  GH_WEB: https://github.com/Yann-Up/coding-for-rc

jobs:
  sync-cnb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tag push 取被推的 tag，手动触发取输入的 tag
          ref: ${{ inputs.tag || github.ref_name }}
          # 必须全量历史：浅克隆（depth=1）往 CNB 推 tag 会被拒（shallow update not allowed）
          fetch-depth: 0

      - name: 校验 tag 并读出版本号
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::no tag available: neither inputs.tag nor a pushed tag name was found"
            exit 1
          fi
          # tools/release-notes.sh 会校验 tag 与 build.sh 的 VERSION_NAME 一致，
          # 并取出 README 更新记录里该 tag 的条目原文，用于 CNB 版清单的 notes。
          bash tools/release-notes.sh "$TAG" > changelog.md
          # 被 tag 的那个提交里必须有 .cnb.yml：CNB 只从该 tag 读流水线配置，
          # 没有它就不会建 Release、不会有附件，清单里的 CNB 直链会是死链。
          # 这种情况直接失败——宁可失败，也不要发出指不到东西的清单。
          if [ ! -f .cnb.yml ]; then
            echo "::error::tag $TAG does not contain .cnb.yml; the CNB pipeline cannot run for it, so the CNB release and its APK attachment would never appear"
            exit 1
          fi
          VERSION=$(awk -F'"' '/^VERSION_NAME="/ { print $2; exit }' build.sh)
          VERSION_CODE=$(awk -F= '/^VERSION_CODE=/ { print $2; exit }' build.sh)
          case "$VERSION_CODE" in
            ''|*[!0-9]*)
              echo "::error::VERSION_CODE not readable from build.sh"
              exit 1
              ;;
          esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "apk=KimiRC-${VERSION}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION versionCode=$VERSION_CODE"

      # tag push 与本工作流同时起跑，而 APK 要等 release.yml 构建并签名完才存在，
      # 所以这里先等它出现，最多等 12 分钟；超时即失败，不带着拿不到的包继续往下走。
      - name: 等待 Release 附件就绪
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            names=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if printf '%s\n' "$names" | grep -qx "$APK"; then
              echo "release $TAG has asset $APK (attempt $attempt)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::release $TAG did not publish $APK within 12 minutes; check the release workflow"
          exit 1

      - name: 下载 APK 并对字节实测 SHA-256
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern "$APK" --clobber
          if [ ! -f "dist/$APK" ]; then
            echo "::error::release $TAG has no asset named $APK"
            exit 1
          fi
          ls -l dist
          SIZE=$(stat -c %s "dist/$APK")
          # 只用实测值：正文里的哈希字符串由人写，可能过时或打错
          SHA256=$(sha256sum "dist/$APK" | awk '{print $1}')
          echo "size=$SIZE sha256=$SHA256"
          {
            echo "size=$SIZE"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: 解析 Release 正文里的证书指纹与发布时间
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > release-body.md
          cat release-body.md
          # release.yml 写的正文格式：- Signer #1 certificate SHA-256 digest: <64位hex>
          CERT=$(sed -n 's/.*Signer #1 certificate SHA-256 digest: *\([0-9a-fA-F]\{64\}\).*/\1/p' release-body.md \
            | head -n 1 | tr 'A-F' 'a-f')
          if [ -z "$CERT" ]; then
            echo "::error::no \"Signer #1 certificate SHA-256 digest\" line found in release $TAG body"
            exit 1
          fi
          # pub_date 取 Release 的发布时间（重跑时保持稳定），并统一补成带毫秒的 ISO8601
          PUB_DATE=$(gh release view "$TAG" --json publishedAt -q .publishedAt)
          PUB_DATE=$(jq -rn --arg d "$PUB_DATE" '$d | sub("\\.[0-9]+Z$"; "Z") | sub("Z$"; ".000Z")')
          echo "pub_date=$PUB_DATE cert=$CERT"
          {
            echo "pub_date=$PUB_DATE"
            echo "cert=$CERT"
          } >> "$GITHUB_OUTPUT"

      - name: 生成 CNB 版清单 latest.json
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK: ${{ steps.meta.outputs.apk }}
          SIZE: ${{ steps.apk.outputs.size }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          PUB_DATE: ${{ steps.release.outputs.pub_date }}
          CERT: ${{ steps.release.outputs.cert }}
        run: |
          set -euo pipefail
          # notes 是 README 更新记录里的原始 Markdown（含 ** 与换行），用 --rawfile 读入由 jq 负责转义
          jq -cn \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg pub_date "$PUB_DATE" \
            --rawfile notes changelog.md \
            --arg url "${CNB_WEB}/-/releases/download/${TAG}/${APK}" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA256" \
            --arg certSha256 "$CERT" \
            --arg github "${GH_WEB}/releases/tag/${TAG}" \
            --arg cnb "${CNB_WEB}/-/releases/tag/${TAG}" \
            '{
               version: $version,
               versionCode: $versionCode,
               pub_date: $pub_date,
               notes: ($notes | sub("\n+$"; "")),
               android: {
                 url: $url,
                 size: $size,
                 sha256: $sha256,
                 certSha256: $certSha256
               },
               github: $github,
               cnb: $cnb
             }' > dist/cnb-latest.json
          jq -e '
            (.version | length > 0) and
            (.versionCode | type == "number") and
            (.notes | length > 0) and
            (.android.url | startswith("https://cnb.cool/")) and
            (.android.size > 0) and
            (.android.sha256 | test("^[0-9a-f]{64}$")) and
            (.android.certSha256 | test("^[0-9a-f]{64}$"))
          ' dist/cnb-latest.json > /dev/null
          cat dist/cnb-latest.json

      - name: 推 tag 到 CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::missing secret CNB_TOKEN"
            exit 1
          fi
          # 用户名固定是 cnb，密码是 token；token 不出现在日志里（set -x 未开启）
          git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" "refs/tags/${TAG}:refs/tags/${TAG}"

      # 推 tag 只是让 CNB 侧的 tag_push 流水线起跑，附件要等它把 APK 从 GitHub 拉下来、
      # 建好同名 Release 才存在。清单一旦提交就指向那条直链，流水线失败会留下永久死链，
      # 所以发布前先实测一次这个直链：整包约 1MB，直接下载算 SHA-256 与本次实测值比对。
      # 到时限仍拿不到或对不上只告警不失败——客户端拿不到 CNB 会回退 GitHub，
      # 在这里硬失败反而会让 CNB 侧彻底没有清单。
      - name: 确认 CNB 附件可下载且哈希一致
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          set -euo pipefail
          URL="${CNB_WEB}/-/releases/download/${TAG}/${APK}"
          for attempt in $(seq 1 32); do
            # curl 用 -f：404/5xx 算失败，留在 if 条件里，不会触发 set -e
            if curl -fsSL --max-time 60 -o probe.apk "$URL"; then
              GOT=$(sha256sum probe.apk | awk '{print $1}')
              if [ "$GOT" = "$SHA256" ]; then
                echo "CNB attachment verified (attempt $attempt): size=$(stat -c %s probe.apk) sha256=$GOT"
                exit 0
              fi
              echo "attempt $attempt: sha256 mismatch, expected $SHA256 got $GOT"
            else
              echo "attempt $attempt: $URL not downloadable yet"
            fi
            sleep 15
          done
          echo "::warning::CNB attachment not verified within 8 minutes ($URL); publishing latest.json anyway, the client falls back to GitHub"

      - name: 把 latest.json 提交到 CNB 的 updater 分支
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO}.git" cnb-sync
          cd cnb-sync
          if git ls-remote --exit-code origin updater >/dev/null 2>&1; then
            git fetch --depth 1 origin updater
            # 这里必须是 -B 而不是 -b：CNB 仓的 HEAD 已经指向 updater，clone 时默认分支
            # 就是这个分支、本地已有同名分支，用 -b 会因「a branch named 'updater' already
            # exists」直接失败（set -e 终止整个步骤），清单再也发不出去。
            # -B 把该分支重置到刚 fetch 的远端提交上，首次与重跑走同一条路径。
            git checkout -B updater FETCH_HEAD
          else
            # 首次创建：orphan 分支，保证 updater 上只有 latest.json，不夹带源码
            git checkout --orphan updater
            git rm -rf . >/dev/null 2>&1 || true
          fi
          # 手动 workflow_dispatch 补同步旧 tag 时，旧清单会直接盖掉 updater 上的最新版本，
          # 让已经升级的客户端看不到更新，所以只允许升不允许降。
          # 现有清单不存在、没有 versionCode 或该字段不是纯数字时一律放行，别让守卫挡住正常发版。
          EXISTING_CODE=""
          if [ -f latest.json ]; then
            EXISTING_CODE=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' latest.json | head -n 1 || true)
          fi
          if [ -z "$EXISTING_CODE" ]; then
            echo "no comparable versionCode on the updater branch; skipping the downgrade guard"
          elif [ "$EXISTING_CODE" -gt "$VERSION_CODE" ]; then
            echo "::error::refusing to downgrade: the updater branch already publishes versionCode $EXISTING_CODE, but this sync (tag $TAG) would overwrite it with $VERSION_CODE"
            exit 1
          else
            echo "downgrade guard passed: updater versionCode $EXISTING_CODE <= $VERSION_CODE ($TAG)"
          fi
          cp ../dist/cnb-latest.json latest.json
          git add latest.json
          # 重跑（或手动补同步）时清单内容不变，直接 commit 会因「nothing to commit」失败；
          # 内容一致就当作已经同步好，安静退出。
          if git diff --cached --quiet; then
            echo "latest.json already up to date on the updater branch"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: latest.json ${TAG}"
          git push origin updater
