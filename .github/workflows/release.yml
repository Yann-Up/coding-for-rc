name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing RELEASE_KEYSTORE_B64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing RELEASE_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing release signing secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          EXPECTED_CHARS=3552
          raw_len=${#KEYSTORE_B64}
          clean=$(printf '%s' "$KEYSTORE_B64" | sed 's/^RELEASE_KEYSTORE_B64=//' | tr -d ' \t\r\n"')
          echo "received ${raw_len} chars, ${#clean} after stripping whitespace/quotes (expected ${EXPECTED_CHARS})"
          bad=$(printf '%s' "$clean" | LC_ALL=C grep -o '[^A-Za-z0-9+/=]' | LC_ALL=C tr -d '\n' \
            | LC_ALL=C sed 's/[^ -~]/?/g' | cut -c1-40 || true)
          if [ -n "$bad" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 contains characters outside base64 (${bad}); paste only the single-line base64 body, with no NAME= prefix, quotes or newlines"
            exit 1
          fi
          if [ $(( ${#clean} % 4 )) -ne 0 ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is ${#clean} chars, not a multiple of 4; it must be exactly ${EXPECTED_CHARS} chars -- the value looks truncated"
            exit 1
          fi
          if ! printf '%s' "$clean" | base64 -d > release.keystore 2>/dev/null; then
            echo "::error::base64 decode failed on ${#clean} chars (expected ${EXPECTED_CHARS} chars); the pasted value is truncated or padded incorrectly"
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::decoded $(stat -c %s release.keystore) bytes is not a readable keystore; check RELEASE_KEYSTORE_B64 and RELEASE_STORE_PASSWORD (expected 2664 bytes)"
            exit 1
          fi
          echo "keystore ok: $(stat -c %s release.keystore) bytes decoded"

      - name: Build signed APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash build.sh

      - name: Collect checksums
        id: meta
        run: |
          APK=$(ls dist/*.apk)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "cert=$(apksigner verify --print-certs "$APK" | grep -i 'SHA-256 digest' | sed 's/^ *//')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          CERT: ${{ steps.meta.outputs.cert }}
        run: |
          {
            echo "非官方社区构建，仅供自用与学习，与 Moonshot AI 无关。"
            echo
            echo "- 文件 SHA-256: \`$SHA256\`"
            echo "- $CERT"
          } > release-notes.md
          gh release create "${{ github.ref_name }}" "${{ steps.meta.outputs.apk }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
